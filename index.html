<style>
  :root{
    --bg:#fbfbfa;
    --surface:#ffffff;
    --text:#1d1d1f;
    --text-dim:#6e6e73;
    --border:rgba(0,0,0,0.07);
    --shadow:rgba(0,0,0,0.06);
    --accent-morning:#b8860b;
    --accent-evening:#3a4a7a;
    --accent: var(--accent-morning);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --surface:#111113;
      --text:#f5f5f7;
      --text-dim:#98989d;
      --border:rgba(255,255,255,0.09);
      --shadow:rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000;
    --surface:#111113;
    --text:#f5f5f7;
    --text-dim:#98989d;
    --border:rgba(255,255,255,0.09);
    --shadow:rgba(0,0,0,0.4);
  }
  html,body{height:100%;}
  *{margin:0; box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    transition:background .5s ease, color .5s ease;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:56px 24px 100px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  .kicker{
    font-size:15px;
    color:var(--text-dim);
    font-weight:400;
    margin-bottom:6px;
    letter-spacing:0.2px;
  }
  h1{
    font-family:'Amiri', serif;
    font-size:38px;
    font-weight:700;
    line-height:1.25;
    letter-spacing:0.3px;
  }
  .toggle{
    display:flex;
    justify-content:center;
    margin:28px 0 8px;
  }
  .toggle-track{
    position:relative;
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px;
    box-shadow:0 1px 3px var(--shadow);
  }
  .toggle-track button{
    position:relative;
    z-index:2;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:16px;
    font-weight:500;

let mode = "morning";
let progress = { morning:{}, evening:{} };

const STORAGE_KEY = 'tooba-progress-v1';
(function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    const today = new Date().toDateString();
    if(saved.date === today && saved.progress){
      progress = saved.progress;
    }
  }catch(e){ /* تجاهل أي خطأ في القراءة، الصفحة تشتغل عادي بدون حفظ */ }
})();

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      date: new Date().toDateString(),
      progress
    }));
  }catch(e){ /* لو التخزين مش متاح، نكمل عادي من غير حفظ */ }
}

const listEl = document.getElementById('list');
const body = document.body;
const btnMorning = document.getElementById('btnMorning');
const btnEvening = document.getElementById('btnEvening');
const title = document.getElementById('pageTitle');
const dateLine = document.getElementById('dateLine');
const progressText = document.getElementById('progressText');
const barFill = document.getElementById('barFill');

const days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const now = new Date();
dateLine.textContent = days[now.getDay()] + " · " + now.toLocaleDateString('ar-EG', {day:'numeric', month:'long'});

function render(){
  body.dataset.mode = mode;
  document.documentElement.style.setProperty('--accent', mode==='morning' ? 'var(--accent-morning)' : 'var(--accent-evening)');
  title.textContent = mode === 'morning' ? 'أذكار الصباح' : 'أذكار المساء';
  btnMorning.classList.toggle('active', mode==='morning');
  btnEvening.classList.toggle('active', mode==='evening');

  const items = data[mode];
  listEl.innerHTML = '';
  items.forEach((item, i) => {
    const remaining = progress[mode][i] ?? item.count;
    const card = document.createElement('div');
    card.className = 'card' + (remaining <= 0 ? ' done' : '');
    card.innerHTML = `
      ${item.note ? `<div class="card-title">${item.note}</div>` : ''}
      <div class="zikr-text">${item.text}</div>
      <div class="card-bottom">
        <div class="count-chip">${remaining <= 0 ? '✓' : remaining}</div>
        ${item.count > 1 && remaining > 0 ? `
          <button class="complete-all-btn" aria-label="إكمال كل التكرارات">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4 4L15 7"/><path d="M9 12l4 4L22 7"/></svg>
          </button>
        ` : ''}
        <div class="card-actions">
          <button class="card-reset-btn" aria-label="إعادة تعيين الذكر">↺</button>
          <button class="share-btn" aria-label="مشاركة">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
          </button>
        </div>
      </div>
    `;
    const completeAllBtn = card.querySelector('.complete-all-btn');
    if(completeAllBtn){
      completeAllBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        progress[mode][i] = 0;
        saveProgress();
        render();
      });
    }
    card.querySelector('.card-reset-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      delete progress[mode][i];
      saveProgress();
      render();
    });
    card.querySelector('.share-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      const originalHTML = btn.innerHTML;
      const shareText = item.text + (item.note ? `\n— ${item.note}` : '');
      try{
        if(navigator.share){
          await navigator.share({ text: shareText, title: 'أذكار' });
        } else {
          await navigator.clipboard.writeText(shareText);
          btn.textContent = '✓';
          setTimeout(()=> btn.innerHTML = originalHTML, 1500);
        }
      }catch(err){ /* المستخدم لغى المشاركة، تجاهل */ }
    });
    card.addEventListener('touchstart', () => card.classList.add('pressed'), { passive:true });
    card.addEventListener('touchend', () => setTimeout(()=>card.classList.remove('pressed'), 100), { passive:true });
    card.addEventListener('touchcancel', () => card.classList.remove('pressed'), { passive:true });
    card.addEventListener('click', () => {
      const current = progress[mode][i] ?? item.count;
      if(current <= 0) return;
      progress[mode][i] = current - 1;
      saveProgress();
      card.classList.add('pulse');
      setTimeout(()=>card.classList.remove('pulse'), 200);
      render();
    });
    listEl.appendChild(card);
  });
  updateProgress();
}

function updateProgress(){
  const items = data[mode];
  const total = items.length;
  const done = items.filter((item,i) => (progress[mode][i] ?? item.count) <= 0).length;
  progressText.textContent = done + ' من ' + total;
  barFill.style.width = (done/total*100) + '%';
}

btnMorning.addEventListener('click', ()=>{ mode='morning'; render(); });
btnEvening.addEventListener('click', ()=>{ mode='evening'; render(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  progress[mode] = {};
  saveProgress();
  render();
});

render();

// تفعيل إحساس اللمس (:active) على كل عناصر الصفحة في سفاري الموبايل
document.addEventListener('touchstart', function(){}, { passive:true });

// الوضع الليلي
const themeToggle = document.getElementById('themeToggle');
const THEME_KEY = 'tooba-theme';

function systemPrefersDark(){
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyThemeIcon(){
  const active = document.documentElement.getAttribute('data-theme') || (systemPrefersDark() ? 'dark' : 'light');
  themeToggle.textContent = active === 'dark' ? '☀️' : '🌙';
}
(function initTheme(){
  try{
    const saved = localStorage.getItem(THEME_KEY);
    if(saved === 'dark' || saved === 'light'){
      document.documentElement.setAttribute('data-theme', saved);
    }
  }catch(e){}
  applyThemeIcon();
})();
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || (systemPrefersDark() ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyThemeIcon();
});

const progressBar = document.querySelector('.progress');
window.addEventListener('scroll', () => {
  progressBar.classList.toggle('scrolled', window.scrollY > 10);
}, { passive:true });

// إضافة للشاشة الرئيسية
const installBtn = document.getElementById('installBtn');
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetSteps = document.getElementById('sheetSteps');
const sheetTitle = document.getElementById('sheetTitle');

const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && 'ontouchend' in document);
const isAndroid = /Android/.test(ua);

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

function stepsFor(){
  if(isIOS){
    return [
      'افتح الصفحة من متصفح Safari',
      'اضغط على أيقونة المشاركة 􀈂 في الأسفل',
      "مرّر لتحت واختر «إضافة إلى الشاشة الرئيسية»",
      'اضغط «إضافة» أعلى الشاشة'
    ];
  }
  if(isAndroid){
    return [
      'اضغط على أيقونة القائمة ⋮ أعلى المتصفح',
      "اختر «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق»",
      'أكّد الإضافة'
    ];
  }
  return [
    'افتح الصفحة من متصفح جهازك المحمول',
    'من قائمة المتصفح اختر «إضافة إلى الشاشة الرئيسية»'
  ];
}

function openSheet(){
  sheetSteps.innerHTML = stepsFor().map((s,i)=>`<li><b>${i+1}</b><span>${s}</span></li>`).join('');
  sheetOverlay.classList.add('open');
}

installBtn.addEventListener('click', async () => {
  if(deferredPrompt){
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if(choice.outcome === 'accepted') return;
  }
  openSheet();
});

document.getElementById('sheetClose').addEventListener('click', ()=> sheetOverlay.classList.remove('open'));
sheetOverlay.addEventListener('click', (e)=> { if(e.target === sheetOverlay) sheetOverlay.classList.remove('open'); });
</script>
