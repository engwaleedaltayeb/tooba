<style>
  :root{
    --bg:#fbfbfa;
    --surface:#ffffff;
    --text:#1d1d1f;
    --text-dim:#6e6e73;
    --border:rgba(0,0,0,0.07);
    --shadow:rgba(0,0,0,0.06);
    --accent-morning:#15ce57;
    --accent-evening:#3a4a7a;
    --accent: var(--accent-morning);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --surface:#111113;
      --text:#f5f5f7;
      --text-dim:#98989d;
      --border:rgba(255,255,255,0.09);
      --shadow:rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000;
    --surface:#111113;
    --text:#f5f5f7;
    --text-dim:#98989d;
    --border:rgba(255,255,255,0.09);
    --shadow:rgba(0,0,0,0.4);
  }
  html{ background:var(--bg); color-scheme:light dark; }
  :root[data-theme="light"]{ color-scheme:light; }
  :root[data-theme="dark"]{ color-scheme:dark; }
  body[data-mode="morning"]{ --accent-text:#0d9a43; }
  body[data-mode="evening"]{ --accent-text:var(--accent-evening); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) body[data-mode="morning"]{ --accent-text:#15ce57; }
    :root:not([data-theme="light"]) body[data-mode="evening"]{ --accent-text:#8ba0e8; }
  }
  :root[data-theme="dark"] body[data-mode="morning"]{ --accent-text:#15ce57; }
  :root[data-theme="dark"] body[data-mode="evening"]{ --accent-text:#8ba0e8; }
  html,body{height:100%;}
  *{margin:0; box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    transition:background .5s ease, color .5s ease;
  }
  .wrap{
    overflow-x:clip;
    max-width:680px;
    margin:0 auto;
    padding:56px 24px 100px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  .kicker{
    font-size:15px;
    color:var(--text-dim);
    font-weight:400;
    margin-bottom:6px;
    letter-spacing:0.2px;
  }
  h1{
    font-family:'Amiri', serif;
    font-size:38px;
    font-weight:700;
    line-height:1.25;
    letter-spacing:0.3px;
  }
  .toggle{
    display:flex;
    justify-content:center;
    margin:28px 0 8px;
  }
  .toggle-track{
    position:relative;
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px;
    box-shadow:0 1px 3px var(--shadow);
  }
  .toggle-track button{
    position:relative;
    z-index:2;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:16px;
    font-weight:500;
    padding:10px 28px;
    border-radius:999px;
    color:var(--text-dim);
    cursor:pointer;
    transition:color .35s ease;
  }
  .toggle-track button.active{color:#fff;}
  .toggle-thumb{
    position:absolute;
    top:4px; bottom:4px;
    width:calc(50% - 4px);
    border-radius:999px;
    background:var(--accent);
    transition:transform .35s cubic-bezier(.65,0,.35,1), background .5s ease;
    z-index:1;
  }
  [data-mode="evening"] .toggle-thumb{ transform:translateX(calc(-100% - 0px)); }

  .progress{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:10;
    text-align:center;
    color:var(--text-dim);
    font-size:15px;
    font-weight:500;
    margin:0 0 30px;
    padding:16px 24px 14px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-bottom:1px solid transparent;
    transition:border-color .3s ease;
  }
  .progress.scrolled{
    border-bottom-color:var(--border);
  }
  .bar-wrap{ position:relative; margin-top:10px; }
  .bar{
    height:12px;
    background:var(--border);
    border-radius:999px;
    overflow:hidden;
    transform-origin:center;
  }
  .bar.pop{ animation:barPop .6s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes barPop{
    0%{ transform:scaleY(1); }
    35%{ transform:scaleY(1.5) scaleX(1.012); }
    70%{ transform:scaleY(.92); }
    100%{ transform:scaleY(1); }
  }
  .bar-fill{
    --bar:#15ce57;
    position:relative;
    height:100%;
    width:0%;
    border-radius:999px;
    overflow:hidden;
    background:var(--bar);
    transition:width .5s cubic-bezier(.25,.9,.4,1.25);
  }
  [data-mode="evening"] .bar-fill{ --bar:#5872d4; }
  /* لمعة تعدي على البار عند التقدم */
  .bar-shine{
    position:absolute;
    top:0; bottom:0;
    left:100%;
    width:70px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
    transform:skewX(-20deg);
    pointer-events:none;
    opacity:0;
  }
  .bar-fill.shine .bar-shine{ animation:shineSweep .85s ease-out; }
  @keyframes shineSweep{
    0%{ left:100%; opacity:1; }
    100%{ left:-80px; opacity:1; }
  }
  /* اكتمال 100%: ذهبي متحرك */

  /* شرارات وكونفيتي */
  .spark{
    position:absolute;
    top:50%;
    pointer-events:none;
    z-index:5;
  }
  /* رسالة تشجيع عند الوصول لمحطة */
  .cheer{
    position:absolute;
    top:calc(100% + 10px);
    left:50%;
    z-index:6;
    padding:7px 16px;
    border-radius:999px;
    background:#15ce57;
    color:#fff;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,-6px) scale(.7);
  }
  [data-mode="evening"] .cheer{ background:#5872d4; }
  .cheer.show{ animation:cheerIn 2s ease forwards; }
  @keyframes cheerIn{
    0%{ opacity:0; transform:translate(-50%,-6px) scale(.7); }
    12%{ opacity:1; transform:translate(-50%,0) scale(1.1); }
    20%{ transform:translate(-50%,0) scale(1); }
    85%{ opacity:1; transform:translate(-50%,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-4px) scale(.96); }
  }
  /* الرقم يكبر لما يزيد */
  .pnum{ display:inline-block; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
  .pnum.bump{ animation:numBump .55s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes numBump{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.7); color:var(--accent-text); }
    100%{ transform:scale(1); }
  }
  [data-mode="evening"] .pnum.bump{ color:#8ba0e8; }

let mode = "morning";
let progress = { morning:{}, evening:{} };

const STORAGE_KEY = 'tooba-progress-v1';
(function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    const today = new Date().toDateString();
    if(saved.date === today && saved.progress){
      progress = saved.progress;
    }
  }catch(e){ /* تجاهل أي خطأ في القراءة، الصفحة تشتغل عادي بدون حفظ */ }
})();

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      date: new Date().toDateString(),
      progress
    }));
  }catch(e){ /* لو التخزين مش متاح، نكمل عادي من غير حفظ */ }
}

const FONT_STEPS = [18,20,22,25,28,32];
const FONT_KEY = 'tooba-font-step';
let fontStep = 2;
try{ const f = parseInt(localStorage.getItem(FONT_KEY),10); if(f>=0 && f<FONT_STEPS.length) fontStep = f; }catch(e){}
function applyFont(){
  document.documentElement.style.setProperty('--zikr-size', FONT_STEPS[fontStep] + 'px');
  document.getElementById('fontMinus').disabled = fontStep === 0;
  document.getElementById('fontPlus').disabled = fontStep === FONT_STEPS.length - 1;
}
function changeFont(d){
  fontStep = Math.max(0, Math.min(FONT_STEPS.length - 1, fontStep + d));
  try{ localStorage.setItem(FONT_KEY, fontStep); }catch(e){}
  applyFont();
}
document.getElementById('fontMinus').addEventListener('click', () => changeFont(-1));
document.getElementById('fontPlus').addEventListener('click', () => changeFont(1));

async function shareOrCopy(btn, text, title){
  const url = 'https://toobaapp.com';
  try{
    if(navigator.share){
      await navigator.share({ title, text, url });
    } else {
      await navigator.clipboard.writeText(text + '\n' + url);
      const label = btn.querySelector('span');
      const original = label.textContent;
      label.textContent = 'تم النسخ ✓';
      setTimeout(() => label.textContent = original, 1800);
    }
  }catch(err){ /* المستخدم لغى المشاركة */ }
}

const ringPrev = { morning:{}, evening:{} };
function drawRing(chip, f, prev){
  if(!chip || f <= 0) return;
  const r = chip.getBoundingClientRect();
  const w = r.width, h = r.height;
  if(!w) return;
  const rad = (h - 1.5) / 2;
  const x0 = 0.75, y0 = 0.75, x1 = w - 0.75, y1 = h - 0.75, cx = w / 2;
  const d = 'M' + cx + ' ' + y0 + 'H' + (x1 - rad) + 'A' + rad + ' ' + rad + ' 0 0 1 ' + (x1 - rad) + ' ' + y1 +
            'H' + (x0 + rad) + 'A' + rad + ' ' + rad + ' 0 0 1 ' + (x0 + rad) + ' ' + y0 + 'H' + cx;
  chip.insertAdjacentHTML('beforeend',
    '<svg class="chip-ring" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
    '<path d="' + d + '" pathLength="100" style="stroke-dasharray:' + Math.max(prev * 100, 0.01).toFixed(2) + ' 100"/></svg>');
  const rect = chip.querySelector('.chip-ring path');
  void rect.getBoundingClientRect();
  rect.style.strokeDasharray = (f * 100).toFixed(2) + ' 100';
}
// اهتزاز خفيف: vibrate على أندرويد، وحيلة switch الخفية على iOS
let hapticOn = false;
try{ hapticOn = localStorage.getItem('tooba-haptic') === '1'; }catch(e){}
let hapticLabel = null;
function haptic(kind, force){
  if(!hapticOn && !force) return;
  try{
    if(navigator.vibrate){
      navigator.vibrate(kind === 'done' ? [12, 45, 22] : 8);
      return;
    }
    if(!hapticLabel){
      hapticLabel = document.createElement('label');
      hapticLabel.setAttribute('aria-hidden', 'true');
      hapticLabel.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none;';
      hapticLabel.innerHTML = '<input type="checkbox" switch tabindex="-1">';
      document.body.appendChild(hapticLabel);
    }
    hapticLabel.click();
    if(kind === 'done') setTimeout(() => hapticLabel.click(), 90);
  }catch(e){}
}
const hapticBtn = document.getElementById('hapticBtn');
function applyHapticBtn(){
  hapticBtn.classList.toggle('on', hapticOn);
  hapticBtn.setAttribute('aria-pressed', hapticOn ? 'true' : 'false');
  hapticBtn.setAttribute('aria-label', hapticOn ? 'إيقاف الاهتزاز' : 'تفعيل الاهتزاز');
}
hapticBtn.addEventListener('click', () => {
  hapticOn = !hapticOn;
  try{ localStorage.setItem('tooba-haptic', hapticOn ? '1' : '0'); }catch(e){}
  applyHapticBtn();
  if(hapticOn){
    haptic('done', true);
    hapticBtn.classList.remove('buzz'); void hapticBtn.offsetWidth; hapticBtn.classList.add('buzz');
  }
});
applyHapticBtn();

function render(){
  body.dataset.mode = mode;
  document.documentElement.style.setProperty('--accent', mode==='morning' ? 'var(--accent-morning)' : 'var(--accent-evening)');
  title.textContent = mode === 'morning' ? 'أذكار الصباح' : 'أذكار المساء';
  btnMorning.classList.toggle('active', mode==='morning');
  btnEvening.classList.toggle('active', mode==='evening');

  const items = data[mode];
  listEl.innerHTML = '';
  items.forEach((item, i) => {
    const remaining = progress[mode][i] ?? item.count;
    if(remaining <= 0) return; // الأذكار المكتملة تختفي من القائمة
    const m = metaFor(i);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.innerHTML = `
      ${item.note ? `<div class="card-title">${item.note}</div>` : ''}
      <div class="zikr-text">${item.text}</div>
      ${m && m[0] ? `<div class="zikr-fadl"><b>الفضل:</b>${m[0]}</div>` : ''}
      ${m && m[1] ? `<div class="zikr-src">${m[1]}</div>` : ''}
      <div class="card-bottom">
        <div class="count-chip">${remaining}</div>
        ${item.count > 1 && remaining > 0 ? `
          <button class="complete-all-btn" aria-label="إكمال كل التكرارات">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4 4L15 7"/><path d="M9 12l4 4L22 7"/></svg>
          </button>
        ` : ''}
        <div class="card-actions">
          <button class="card-reset-btn" aria-label="إعادة تعيين الذكر"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button class="share-btn" aria-label="مشاركة">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8.5 7.5L12 4l3.5 3.5"/><path d="M5 12v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"/></svg>
          </button>
        </div>
      </div>
    `;
    const completeAllBtn = card.querySelector('.complete-all-btn');
    if(completeAllBtn){
      completeAllBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const current = progress[mode][i] ?? item.count;
        haptic('done');
        completeItem(card, i, current);
      });
    }
    card.querySelector('.card-reset-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      delete progress[mode][i];
      saveProgress();
      updateProgress();
      const chip = card.querySelector('.count-chip');
      const path = chip.querySelector('.chip-ring path');
      if(path && !reduceMotion){
        chip.classList.add('resetting');
        chip.childNodes[0].nodeValue = item.count;
        path.style.strokeDasharray = '0.01 100';
        setTimeout(() => { if(card.isConnected) render(); }, 500);
      } else {
        render();
      }
    });
    card.querySelector('.share-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      const originalHTML = btn.innerHTML;
      const shareText = item.text + (item.note ? `\n— ${item.note}` : '');
      try{
        if(navigator.share){
          await navigator.share({ text: shareText, title: 'أذكار', url: 'https://toobaapp.com' });
        } else {
          await navigator.clipboard.writeText(shareText + '\nhttps://toobaapp.com');
          btn.textContent = '✓';
          setTimeout(()=> btn.innerHTML = originalHTML, 1500);
        }
      }catch(err){ /* المستخدم لغى المشاركة، تجاهل */ }
    });
    card.addEventListener('touchstart', () => card.classList.add('pressed'), { passive:true });
    card.addEventListener('touchend', () => setTimeout(()=>card.classList.remove('pressed'), 100), { passive:true });
    card.addEventListener('touchcancel', () => card.classList.remove('pressed'), { passive:true });
    card.addEventListener('click', () => {
      const current = progress[mode][i] ?? item.count;
      if(current <= 0 || card.classList.contains('leaving')) return;
      if(current - 1 <= 0){
        haptic('done');
        completeItem(card, i, current);
        return;
      }
      haptic('tap');
      progress[mode][i] = current - 1;
      saveProgress();
      card.classList.add('pulse');
      setTimeout(()=>card.classList.remove('pulse'), 200);
      render();
    });
    listEl.appendChild(card);
    const f = (item.count - remaining) / item.count;
    drawRing(card.querySelector('.count-chip'), f, ringPrev[mode][i] ?? f);
    ringPrev[mode][i] = f;
  });
  if(!listEl.children.length){
    const empty = document.createElement('div');
    empty.className = 'all-done';
    empty.innerHTML = `
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>
      <div class="all-done-title">${mode === 'morning' ? 'أتممت أذكار الصباح' : 'أتممت أذكار المساء'}</div>
      <div class="all-done-sub">تقبّل الله منك</div>
      <div class="done-actions">
        <button class="done-btn primary" id="remindBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span>ذكّر أحبابك وأصدقاءك بالأذكار</span>
        </button>
        <button class="done-btn" id="shareSiteBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8.5 7.5L12 4l3.5 3.5"/><path d="M5 12v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"/></svg>
          <span>شارك الموقع</span>
        </button>
      </div>
    `;
    listEl.appendChild(empty);
    const remindText = mode === 'morning'
      ? 'لا تنسَ أذكار الصباح 🤍 ذكّرتك بها هنا:'
      : 'لا تنسَ أذكار المساء 🤍 ذكّرتك بها هنا:';
    empty.querySelector('#remindBtn').addEventListener('click', (e) => shareOrCopy(e.currentTarget, remindText, 'أذكار الصباح والمساء'));
    empty.querySelector('#shareSiteBtn').addEventListener('click', (e) => shareOrCopy(e.currentTarget, 'أذكار الصباح والمساء', 'أذكار الصباح والمساء'));
  }
  updateProgress();
}

// ---------- إكمال الذكر: سلايد لليسار + مهلة تراجع 5 ثواني ----------
const UNDO_SECONDS = 5;
const RING_LEN = 94.25;
const undoToast = document.getElementById('undoToast');
const undoCount = document.getElementById('undoCount');
const undoBtn = document.getElementById('undoBtn');
const ringFg = document.getElementById('ringFg');
let undoState = null;

function hideUndo(){
  if(undoState){ clearInterval(undoState.interval); undoState = null; }
  undoToast.classList.remove('show');
}

function showUndo(m, index, prev){
  if(undoState){ clearInterval(undoState.interval); }
  undoState = { mode:m, index, prev, interval:null };
  let sec = UNDO_SECONDS;
  undoCount.textContent = sec;
  ringFg.style.transition = 'none';
  ringFg.style.strokeDashoffset = '0';
  void ringFg.getBoundingClientRect();
  ringFg.style.transition = 'stroke-dashoffset ' + UNDO_SECONDS + 's linear';
  ringFg.style.strokeDashoffset = RING_LEN;
  undoToast.classList.add('show');
  undoState.interval = setInterval(() => {
    sec--;
    if(sec <= 0){ hideUndo(); return; }
    undoCount.textContent = sec;
  }, 1000);
}

function slideOut(card, done){
  card.classList.add('leaving');
  setTimeout(() => {
    card.style.height = card.offsetHeight + 'px';
    void card.offsetHeight;
    card.classList.add('collapsing');
    setTimeout(done, 260);
  }, 320);
}

// تثبيت الشاشة: نمنع انكماش ارتفاع الصفحة من تحريك المحتوى للأسفل
const wrapEl = document.querySelector('.wrap');
function lockScrollHeight(){
  wrapEl.style.minHeight = (window.scrollY + window.innerHeight) + 'px';
}
function unlockScrollHeight(){
  wrapEl.style.minHeight = '';
}
window.addEventListener('scroll', () => {
  if(!wrapEl.style.minHeight) return;
  const need = window.scrollY + window.innerHeight;
  if(need < parseFloat(wrapEl.style.minHeight)) wrapEl.style.minHeight = need + 'px';
}, { passive:true });

function completeItem(card, index, prevRemaining){
  if(card.dataset.completing) return;
  card.dataset.completing = '1';
  progress[mode][index] = 0;
  saveProgress();
  updateProgress();
  lockScrollHeight();
  showUndo(mode, index, prevRemaining);
  // الرقم يبقى صفر والإطار يكمل قبل ما الكارد تختفي
  const chip = card.querySelector('.count-chip');
  if(chip){
    chip.classList.add('completing');
    chip.childNodes[0].nodeValue = '';
    chip.insertAdjacentHTML('afterbegin', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>');
    if(data[mode][index].count > 1){
      const path = chip.querySelector('.chip-ring path');
      if(path) path.style.strokeDasharray = '100 100';
      else drawRing(chip, 1, 0);
    }
  }
  setTimeout(() => slideOut(card, () => {
    render();
    if(listEl.querySelector('.all-done')){
      unlockScrollHeight();
      window.scrollTo({ top:0, behavior:'smooth' });
    }
  }), reduceMotion ? 0 : 50);
}

undoBtn.addEventListener('click', () => {
  if(!undoState) return;
  const { mode:m, index, prev } = undoState;
  progress[m][index] = prev;
  saveProgress();
  hideUndo();
  render();
  const back = listEl.querySelector('[data-index="' + index + '"]');
  if(back) back.classList.add('enter');
});

// ---------- حماس البروجريس بار ----------
const barWrap = document.getElementById('barWrap');
const barEl = barWrap.querySelector('.bar');
const cheerEl = document.getElementById('cheer');
const lastDone = { morning:null, evening:null };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MILESTONES = [[100,'ما شاء الله! أتممت الأذكار'],[75,'اقتربت من النهاية'],[50,'نصف الطريق!'],[25,'بداية ممتازة']];
let cheerTimer = null;

function burst(rightPct, count, o){
  if(reduceMotion) return;
  for(let k = 0; k < count; k++){
    const p = document.createElement('i');
    p.className = 'spark';
    const s = o.size[0] + Math.random() * (o.size[1] - o.size[0]);
    const x = o.spreadBar ? (5 + Math.random() * 90) : rightPct;
    p.style.right = x + '%';
    p.style.width = s + 'px';
    p.style.height = (o.rect ? s * 0.55 : s) + 'px';
    p.style.background = o.colors[k % o.colors.length];
    p.style.borderRadius = o.rect ? '2px' : '50%';
    barWrap.appendChild(p);
    const dx = (Math.random() - 0.5) * 2 * o.dx;
    const up = o.up[0] + Math.random() * (o.up[1] - o.up[0]);
    const rot = (Math.random() - 0.5) * 720;
    const a = p.animate([
      { transform:'translate(0,-50%) scale(1) rotate(0deg)', opacity:1 },
      { transform:'translate(' + (dx * 0.6) + 'px,' + (-up) + 'px) scale(1) rotate(' + (rot * 0.5) + 'deg)', opacity:1, offset:0.45 },
      { transform:'translate(' + dx + 'px,' + o.fall + 'px) scale(.5) rotate(' + rot + 'deg)', opacity:0 }
    ], { duration: o.dur[0] + Math.random() * (o.dur[1] - o.dur[0]), easing:'cubic-bezier(.2,.7,.4,1)', fill:'forwards' });
    a.onfinish = () => p.remove();
  }
}

function showCheer(text){
  cheerEl.textContent = text;
  cheerEl.classList.remove('show');
  void cheerEl.offsetWidth;
  cheerEl.classList.add('show');
  clearTimeout(cheerTimer);
  cheerTimer = setTimeout(() => cheerEl.classList.remove('show'), 2000);
}

function celebrate(prev, done, total, pct){
  barEl.classList.remove('pop'); void barEl.offsetWidth; barEl.classList.add('pop');
  barFill.classList.remove('shine'); void barFill.offsetWidth; barFill.classList.add('shine');
  const num = progressText.querySelector('.pnum');
  if(num) num.classList.add('bump');
  const ev = mode === 'evening';
  burst(pct, 10, { colors: ev ? ['#ffffff','#c9d3f7','#8ba0e8','#e8ecfc'] : ['#ffffff','#b9f5cf','#7ee8a8','#e3fcee'], size:[3,6], dx:30, up:[14,34], fall:6, dur:[550,950] });
  const prevPct = prev / total * 100;
  const hit = MILESTONES.find(([m]) => prevPct < m && pct >= m);
  if(hit) showCheer(hit[1]);
  if(done === total){
    burst(50, 38, { spreadBar:true, rect:true, colors: ev ? ['#5872d4','#8ba0e8','#ffffff','#3a4a7a','#c9d3f7','#f3e6a6','#7c6fd6'] : ['#15ce57','#7ee8a8','#ffffff','#0f9a63','#b9f5cf','#f2c94c','#4ecdc4'], size:[6,10], dx:90, up:[30,80], fall:170, dur:[1100,1700] });
  }
}

function updateProgress(){
  const items = data[mode];
  const total = items.length;
  const done = items.filter((item,i) => (progress[mode][i] ?? item.count) <= 0).length;
  const pct = done / total * 100;
  progressText.innerHTML = '<b class="pnum">' + done + '</b> من ' + total;
  barFill.style.width = pct + '%';
  barWrap.classList.toggle('full', done === total);
  const prev = lastDone[mode];
  lastDone[mode] = done;
  if(prev !== null && done > prev) celebrate(prev, done, total, pct);
}

document.getElementById('resetBtn').addEventListener('click', ()=>{
  hideUndo();
  unlockScrollHeight();
  progress[mode] = {};
  saveProgress();
  render();
});

  // لون شريط الحالة يتبع الثيم الفعلي: أسود للداك، ولون الخلفية للايت
  const c = active === 'dark' ? '#000000' : '#fbfbfa';
  const old = document.getElementById('themeMeta');
  const fresh = document.createElement('meta');
  fresh.name = 'theme-color';
  fresh.id = 'themeMeta';
  fresh.content = c;
  old.replaceWith(fresh);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyThemeIcon);
(function initTheme(){
  try{
    const saved = localStorage.getItem(THEME_KEY);
    if(saved === 'dark' || saved === 'light'){
      document.documentElement.setAttribute('data-theme', saved);
    }
  }catch(e){}
  applyThemeIcon();
})();
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || (systemPrefersDark() ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyThemeIcon();
});

const siteShareBtn = document.getElementById('siteShareBtn');
const siteShareLabel = document.getElementById('siteShareLabel');
siteShareBtn.addEventListener('click', async () => {
  const url = 'https://toobaapp.com';
  try{
    if(navigator.share){
      await navigator.share({ title:'طوبى — أذكار الصباح والمساء', text:'أذكار الصباح والمساء', url });
    } else {
      await navigator.clipboard.writeText('أذكار الصباح والمساء\n' + url);
      siteShareLabel.textContent = 'تم النسخ ✓';
      setTimeout(() => siteShareLabel.textContent = 'شارك الأجر', 1600);
    }
  }catch(err){ /* المستخدم لغى المشاركة */ }
});

const progressBar = document.querySelector('.progress');
window.addEventListener('scroll', () => {
  progressBar.classList.toggle('scrolled', window.scrollY > 10);
}, { passive:true });

// إضافة للشاشة الرئيسية
const installBtn = document.getElementById('installBtn');
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetSteps = document.getElementById('sheetSteps');
const sheetTitle = document.getElementById('sheetTitle');

const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && 'ontouchend' in document);
const isAndroid = /Android/.test(ua);

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

function stepsFor(){
  if(isIOS){
    return [
      'افتح الصفحة من متصفح Safari',
      'اضغط على أيقونة المشاركة 􀈂 في الأسفل',
      "مرّر لتحت واختر «إضافة إلى الشاشة الرئيسية»",
      'اضغط «إضافة» أعلى الشاشة'
    ];
  }
  if(isAndroid){
    return [
      'اضغط على أيقونة القائمة ⋮ أعلى المتصفح',
      "اختر «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق»",
      'أكّد الإضافة'
    ];
  }
  return [
    'افتح الصفحة من متصفح جهازك المحمول',
    'من قائمة المتصفح اختر «إضافة إلى الشاشة الرئيسية»'
  ];
}

function openSheet(){
  sheetSteps.innerHTML = stepsFor().map((s,i)=>`<li><b>${i+1}</b><span>${s}</span></li>`).join('');
  sheetOverlay.classList.add('open');
}

installBtn.addEventListener('click', async () => {
  if(deferredPrompt){
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if(choice.outcome === 'accepted') return;
  }
  openSheet();
});

document.getElementById('sheetClose').addEventListener('click', ()=> sheetOverlay.classList.remove('open'));
sheetOverlay.addEventListener('click', (e)=> { if(e.target === sheetOverlay) sheetOverlay.classList.remove('open'); });
</script>
</body>
</html>
