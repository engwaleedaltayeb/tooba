name = "tooba-push"
main = "index.js"
compatibility_date = "2024-11-01"

# الـ API على نفس دومين الموقع، فلا حاجة لـ CORS
routes = [{ pattern = "toobaapp.com/api/*", zone_name = "toobaapp.com" }]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tooba-push"
database_id = "9883eafc-c37e-48da-a961-e10feaf4bf07"
